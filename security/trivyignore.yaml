vulnerabilities:
  # --- node_exporter v1.12.1 (bound image in the base) --------------------
  # Latest upstream release; fixes need an upstream rebuild with newer Go
  # modules. Exposure: the exporter is disabled until configured, listens
  # only with TLS + basic auth, runs read-only with no capabilities.
  # Renovate bumps the image as soon as upstream releases. Review on expiry.
  - id: CVE-2026-56854
    paths: ["bin/node_exporter"]
    statement: "node_exporter v1.12.1 (golang.org/x/crypto/ssh); awaiting upstream release. Accepted 2026-11-15."
    expired_at: 2026-12-15
  - id: CVE-2026-78661
    paths: ["bin/node_exporter", "bin/prometheus", "bin/promtool", "bin/alertmanager", "bin/amtool"]
    statement: "golang.org/x/net/html DoS (fixed in x/net 0.62.0) in node_exporter v1.12.1, prometheus v3.16.0 and alertmanager v0.35.0, all latest upstream; awaiting upstream releases. Same exposure as node_exporter: off until web.yml (TLS + auth) exists, read-only, no capabilities. Accepted 2026-11-15 (node_exporter), 2026-11-16 (prometheus role)."
    expired_at: 2026-12-15
