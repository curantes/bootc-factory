# Data directories; the upstream images run as nobody (65534).
d /var/lib/prometheus              0755 root  root  -
d /var/lib/prometheus/data         0750 65534 65534 -
d /var/lib/prometheus/alertmanager 0750 65534 65534 -

# Config and secrets the containers read as gid 65534 (the images' nobody).
# Always numeric: in the AlmaLinux bootc base (/usr/lib/group) the host's
# "nobody" is gid 99 and 65534 is "nfsnobody", so `owner: root:nobody` in
# cloud-init gives files the container cannot read. Whatever group was set,
# these lines fix it before every start (both Quadlets run this file in
# ExecStartPre). Mode "-" keeps the mode (0640 files, 0750 dirs per docs);
# missing paths are skipped.
z /etc/prometheus/web.yml            - root 65534 -
Z /etc/prometheus/secrets            - root 65534 -
Z /etc/prometheus/tls                - root 65534 -
z /etc/alertmanager/web.yml          - root 65534 -
z /etc/alertmanager/alertmanager.yml - root 65534 -
Z /etc/alertmanager/secrets          - root 65534 -
Z /etc/alertmanager/tls              - root 65534 -
