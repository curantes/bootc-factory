# Weekly qcow2 disk images (generic KVM/QEMU cloud image) built from the
# signed, promoted container images and published as a GitHub Release.
# A disk image only seeds new VMs; they then update via `bootc upgrade`.
name: disk-images

on:
  schedule:
    - cron: "07 6 * * 1" # Monday, after the weekly forced image rebuild
  workflow_dispatch:
    inputs:
      images:
        description: 'JSON list of images, e.g. ["base"] (default: all)'
        type: string
        default: ""

permissions: {}

concurrency:
  group: disk-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: m
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          images=${IMAGES:-$(jq -c '["base"] + .' <<<"$(scripts/plan.sh images)")}
          matrix=$(for img in $(jq -r '.[]' <<<"$images"); do
            scripts/plan.sh matrix "$img" | jq -c --arg img "$img" '.include[] | {image: $img, version, arch, runner}'
          done | jq -sc '{include: .}')
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "tag=disk-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    name: qcow2 ${{ matrix.image }} ${{ matrix.version }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ matrix.image }}
      VERSION: ${{ matrix.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Set up runner
        run: |
          scripts/ci-setup.sh disk-image
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Resolve and verify the published image
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | sudo env -u XDG_RUNTIME_DIR podman login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          repo="ghcr.io/${OWNER,,}/bootc-$IMAGE"
          digest=$(skopeo inspect --raw "docker://$repo:$VERSION" | sha256sum | cut -d' ' -f1)
          ref="$repo@sha256:$digest"
          cosign verify --key keys/cosign.pub "$ref" >/dev/null
          echo "Verified $ref"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Build qcow2
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p dist
          name="bootc-$IMAGE-$VERSION-$(uname -m).qcow2"
          scripts/disk-image.sh "$REF" "dist/$name"
          echo "NAME=$name" >>"$GITHUB_ENV"

      - name: Sign (cosign key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --bundle "dist/$NAME.sigstore.json" "dist/$NAME"
          sha256sum "dist/$NAME" | sed 's#dist/##' >"dist/$NAME.sha256"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-${{ matrix.image }}-${{ matrix.version }}-${{ matrix.arch }}
          path: dist/
          retention-days: 3
          compression-level: 0

  release:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: keys
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: disk-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cp keys/cosign.pub dist/
          cd dist
          cat ./*.sha256 >SHA256SUMS
          rm -f ./*.sha256
          {
            echo "Generic KVM/QEMU cloud images (qcow2, cloud-init) built from the signed images in this repository."
            echo
            echo "Verify before importing:"
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "cosign verify-blob --key cosign.pub --bundle <file>.sigstore.json <file>"
            echo "gh attestation verify <file> --repo $REPO"
            echo '```'
          } >notes.md
          gh release create "$TAG" --repo "$REPO" --title "Disk images $TAG" \
            --notes-file notes.md ./*.qcow2 ./*.sigstore.json SHA256SUMS cosign.pub
